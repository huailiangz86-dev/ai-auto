# ============================================================
# AI auto - CI/CD Pipeline
# GitHub Actions - On PR
# ============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.bmad/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----- Lint & Type Check -----
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint:check

      - name: Prettier Check
        run: pnpm format --check

  # ----- API Tests -----
  test-api:
    name: Test API (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ai_auto
          POSTGRES_PASSWORD: ai_auto_dev
          POSTGRES_DB: ai_auto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations and tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: ai_auto
          DB_PASSWORD: ai_auto_dev
          DB_NAME: ai_auto_test
          REDIS_HOST: localhost
          JWT_SECRET: test-secret
        run: |
          pnpm --filter @ai-auto/api migration:run
          pnpm --filter @ai-auto/api test
          pnpm --filter @ai-auto/api test:e2e

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage/lcov.info
          flags: api

  # ----- AI Agent Tests -----
  test-ai-agent:
    name: Test AI Agent (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./apps/ai-agent
        run: uv sync --frozen

      - name: Run tests
        working-directory: ./apps/ai-agent
        run: pytest

  # ----- Build -----
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test-api, test-ai-agent]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: ai-auto/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Agent image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-agent
          file: ./apps/ai-agent/Dockerfile
          push: false
          tags: ai-auto/ai-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
