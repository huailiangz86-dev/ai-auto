# ============================================================
# AI auto - Docker Compose Local Development Environment
# ============================================================
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and remove volumes (CLEAN slate)
#
# Note: Docker is optional. Without Docker, run PostgreSQL and Redis
# natively on the host machine.
# ============================================================

name: ai-auto

services:
  # ----- Database -----
  postgres:
    image: postgres:17-alpine
    container_name: ai-auto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_auto
      POSTGRES_PASSWORD: ai_auto_dev
      POSTGRES_DB: ai_auto_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts (run once on first start)
      - ./infrastructure/docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_auto -d ai_auto_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-auto-network

  # ----- Redis -----
  redis:
    image: redis:7-alpine
    container_name: ai-auto-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-auto-network

  # ----- Redis for Rate Limiting (separate instance) -----
  redis-rate-limit:
    image: redis:7-alpine
    container_name: ai-auto-redis-rate-limit
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_rate_limit_password
    ports:
      - "6380:6379"
    volumes:
      - redis_rate_limit_data:/data
    networks:
      - ai-auto-network

  # ----- AI Agent Service (FastAPI) -----
  ai-agent:
    build:
      context: ./apps/ai-agent
      dockerfile: Dockerfile
    container_name: ai-auto-ai-agent
    restart: unless-stopped
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://ai_auto:ai_auto_dev@postgres:5432/ai_auto_dev
      REDIS_URL: redis://:redis_dev_password@redis:6379/1
      CELERY_BROKER_URL: redis://:redis_dev_password@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:redis_dev_password@redis:6379/3
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-auto-network

  # ----- Core API Service (NestJS) -----
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai-auto-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ai_auto
      DB_PASSWORD: ai_auto_dev
      DB_NAME: ai_auto_dev
      DB_SYNCHRONIZE: "true"  # Only for local dev!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      JWT_SECRET: dev-secret-change-in-production
      AI_AGENT_SERVICE_URL: http://ai-agent:8000
      CORS_ORIGINS: "http://localhost:3100"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_started
    networks:
      - ai-auto-network

  # ----- Celery Worker (Background tasks) -----
  celery-worker:
    build:
      context: ./apps/ai-agent
      dockerfile: Dockerfile
    container_name: ai-auto-celery
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_auto:ai_auto_dev@postgres:5432/ai_auto_dev
      CELERY_BROKER_URL: redis://:redis_dev_password@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:redis_dev_password@redis:6379/3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-auto-network

  # ----- PgAdmin (Database management UI) -----
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ai-auto-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ai-auto.local
      PGADMIN_DEFAULT_PASSWORD: admin_dev
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ai-auto-network

  # ----- Redis Commander (Redis management UI) -----
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-auto-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_dev_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - ai-auto-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_rate_limit_data:
    driver: local

networks:
  ai-auto-network:
    driver: bridge
