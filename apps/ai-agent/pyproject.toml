[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "ai-auto-ai-agent"
version = "0.1.0"
description = "AI auto - AI Agent service (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115.6,<0.116",
  "uvicorn>=0.34.0,<0.35",
  "pydantic>=2.10.4,<3",
  "pydantic-settings>=2.7.0,<3",
  "httpx>=0.28.1,<0.29",
  "anthropic>=0.42.0,<0.43",
  "redis>=5.2.1,<6",
  "sqlalchemy>=2.0.36,<3",
  "asyncpg>=0.30.0,<0.31",
  "python-dotenv>=1.0.1,<2",
  "python-jose>=3.3.0,<4",
  "passlib>=1.7.4,<2",
  "alembic>=1.14.0,<2",
  "sentry-sdk>=2.18.0,<3",
  "structlog>=24.4.0,<25",
  "python-multipart>=0.0.20,<0.1",
  "tenacity>=9.0.0,<10",
  "celery>=5.4.0,<6",
]

[dependency-groups]
dev = [
  "faker>=33.3.1,<34",
  "mypy>=1.14.0,<2",
  "pytest>=8.3.4,<9",
  "pytest-asyncio>=0.24.0,<0.25",
  "pytest-cov>=6.0.0,<7",
  "ruff>=0.8.4,<0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
